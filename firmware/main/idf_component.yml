## IDF Component Manager Manifest File
dependencies:
  # Waveshare's official BSP for this board: it already ships the CO5300 driver
  # (QSPI), the CST9220 touch, the AXP2101 and the LVGL integration.
  waveshare/esp32_s3_touch_amoled_2_16:
    version: "^2.0.1"
  lvgl/lvgl:
    version: "9.*"
    public: true
  # Resolves "<mac>.local" — macOS announces that on its own, so the board
  # survives a DHCP address change without being reconfigured.
  espressif/mdns:
    version: "^1.8"
  # 6-axis IMU: we use the accelerometer to know which way the board is turned
  # and rotate the screen with it.
  waveshare/qmi8658:
    version: "*"
